<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aligned Layout</title>
    <style>
        /* Container wrapper */
        #container-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            max-width: 100%;
        }

        /* Styling for containers */
        .container {
            width: 350px;
            min-height: 100px;
            background-color: lightblue;
            padding: 10px;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Left section (Text + Buttons) */
        .left-section {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Button Container (Aligns buttons in one row) */
        .button-container {
            display: flex;
            gap: 5px; /* Space between buttons */
        }

        /* Right section (Image) */
        .right-section img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
        }

        .btn {
            padding: 5px;
            border: none;
            cursor: pointer;
            width: 80px;
            text-align: center;
        }

        .edit-btn {
            background-color: green;
            color: white;
        }

        .delete-btn {
            background-color: red;
            color: white;
        }

        /* ===== Popup Styles ===== */
        #edit-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            display: none; /* Initially hidden */
            z-index: 1001;
            width: 300px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none; /* Initially hidden */
            z-index: 1000;
        }

        #edit-modal input {
            display: block;
            width: 100%;
            padding: 5px;
            margin-top: 5px;
        }

        #edit-modal button {
            margin-top: 10px;
            padding: 5px;
            width: 100%;
        }
    </style>
</head>
<body>

    <button onclick="addContainer()">Add Container</button>
    <div id="container-wrapper"></div>

    <!-- Overlay and Modal for Editing -->
    <div id="overlay" onclick="closeEditContainer()"></div>
    <div id="edit-modal">
        <h3>Edit Container</h3>
        <input type="text" id="edit-name" placeholder="Enter Name">
        <input type="text" id="edit-desc" placeholder="Enter Description">
        <input type="text" id="edit-img" placeholder="Enter Image URL">
        <button onclick="saveEdit()">Save</button>
        <button onclick="closeEditContainer()">Cancel</button>
    </div>

    <script>
        let currentContainer = null; // Stores the currently editing container

        function addContainer() {
            let newContainer = document.createElement("div");
            newContainer.classList.add("container");

            // Left Section (Text + Buttons)
            let leftSection = document.createElement("div");
            leftSection.classList.add("left-section");

            let name = document.createElement("h3");
            name.textContent = "Product Name:";

            let price = document.createElement("h5")
            price.textContext = "Price:"

            let description = document.createElement("p");
            description.textContent = " Product Description:";

            // Button Container (Holds Edit & Delete buttons)
            let buttonContainer = document.createElement("div");
            buttonContainer.classList.add("button-container");

            let editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.classList.add("btn", "edit-btn");
            editBtn.onclick = function () {
                openEditContainer(newContainer, name, price, description, image);
            };

            let deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.classList.add("btn", "delete-btn");
            deleteBtn.onclick = function () {
                if (confirm("Are you sure you want to delete this container?")) {
                    newContainer.remove();
                }
            };

            buttonContainer.appendChild(editBtn);
            buttonContainer.appendChild(deleteBtn);

            leftSection.appendChild(name);
            leftSection.appendChild(price);
            leftSection.appendChild(description);
            leftSection.appendChild(buttonContainer);

            // Right Section (Image)
            let rightSection = document.createElement("div");
            rightSection.classList.add("right-section");

            let image = document.createElement("img");
            image.src = "https://via.placeholder.com/100"; // Default image
            rightSection.appendChild(image);

            // Append sections to container
            newContainer.appendChild(leftSection);
            newContainer.appendChild(rightSection);

            document.getElementById("container-wrapper").appendChild(newContainer);
        }

        function openEditContainer(container, nameEl, descEl, imgEl) {
            currentContainer = { container, nameEl, descEl, imgEl };

            // Populate input fields with current values
            document.getElementById("edit-img").value = imgEl.src;

            // Show the modal
            document.getElementById("edit-modal").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

        function closeEditContainer() {
            document.getElementById("edit-modal").style.display = "none";
            document.getElementById("overlay").style.display = "none";
        }

        function saveEdit() {
            if (currentContainer) {
                let nameInput = document.getElementById("edit-name").value;
                let descInput = document.getElementById("edit-desc").value;
                let imgInput = document.getElementById("edit-img").value;

                currentContainer.nameEl.textContent = "Name: " + nameInput;
                currentContainer.descEl.textContent = "Description: " + descInput;
                currentContainer.imgEl.src = imgInput;

                closeEditContainer(); // Hide modal after saving
            }
        }
    </script>

</body>
</html>
